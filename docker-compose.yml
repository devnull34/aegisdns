services:
  aegisdns:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegisdns:latest
    container_name: aegisdns
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - AUTO_SYNC_ENABLED=true
      - AUTO_SYNC_HOURS=6
      - RUST_LOG=info
    volumes:
      - aegis_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aegis_data:
