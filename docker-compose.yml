services:
  aegisdns:
    # Build locally or pull from private GitHub Container Registry (GHCR)
    image: ${DOCKER_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-your-org}/aegisdns:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Pass GitHub token only if building with private git submodules
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    container_name: aegisdns
    # Restart policy: automatically restarts container on reboot or crash unless explicitly stopped
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - AUTO_SYNC_ENABLED=${AUTO_SYNC_ENABLED:-true}
      - AUTO_SYNC_HOURS=${AUTO_SYNC_HOURS:-6}
    volumes:
      # Mount persistent storage for sources, custom lists, whitelist, and settings
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aegis_data:
